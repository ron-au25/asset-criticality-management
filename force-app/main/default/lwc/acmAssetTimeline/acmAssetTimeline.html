<template>
    <lightning-card title="Asset Work Order Timeline" icon-name="standard:timeline">
        <div slot="actions" class="summary">{summary}</div>
        <div class="slds-p-horizontal_medium wrap">
            <div class="bar-top">
                <div class="nav">
                    <div class="nav-btns">
                        <lightning-button-icon icon-name="utility:chevronleft" variant="border" alternative-text="Previous" onclick={handlePrev}></lightning-button-icon>
                        <lightning-button label="Today" onclick={handleToday}></lightning-button>
                        <lightning-button-icon icon-name="utility:chevronright" variant="border" alternative-text="Next" onclick={handleNext}></lightning-button-icon>
                    </div>
                    <span class="range">{rangeLabel}</span>
                </div>
                <div class="quick">
                    <lightning-combobox class="ctl" name="view" label="View" variant="label-hidden" value={view} options={viewOptions} onchange={handleView}></lightning-combobox>
                    <lightning-combobox class="ctl" name="colour" label="Colour by" variant="label-hidden" value={colourMode} options={colourOptions} onchange={handleColour}></lightning-combobox>
                    <lightning-button-icon icon-name="utility:refresh" variant="border" alternative-text="Refresh" title="Refresh" disabled={isLoading} onclick={handleRefresh}></lightning-button-icon>
                    <template if:true={showGrouping}>
                        <div class="nav-btns">
                            <lightning-button-icon icon-name="utility:expand_all" variant="border" alternative-text="Expand all" title="Expand all" onclick={handleExpandAll}></lightning-button-icon>
                            <lightning-button-icon icon-name="utility:collapse_all" variant="border" alternative-text="Collapse all" title="Collapse all" onclick={handleCollapseAll}></lightning-button-icon>
                        </div>
                    </template>
                    <button class="filter-toggle" type="button" aria-expanded={filtersOpen} onclick={handleFilterToggle}>
                        <lightning-icon icon-name={filterIcon} size="xx-small"></lightning-icon>
                        <span>{filterLabel}</span>
                    </button>
                </div>
            </div>

            <template if:true={filtersOpen}>
                <div class="filters">
                    <lightning-input type="date" label="Start date" value={startDate} onchange={handleStart}></lightning-input>
                    <lightning-combobox label="Criticality" value={critFilter} options={critOptions} onchange={handleCrit}></lightning-combobox>
                    <template if:true={showFilters}>
                        <lightning-combobox label="Centre" value={centreId} options={centreOptions} onchange={handleCentre}></lightning-combobox>
                        <lightning-combobox label="Building" value={buildingId} options={buildingOptions} onchange={handleBuilding}></lightning-combobox>
                        <lightning-combobox label="Level" value={levelId} options={levelOptions} onchange={handleLevel}></lightning-combobox>
                        <lightning-combobox label="Space" value={roomId} options={roomOptions} onchange={handleRoom}></lightning-combobox>
                    </template>
                </div>
            </template>

            <template if:true={error}>
                <div class="slds-text-color_error">{error}</div>
            </template>
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <template if:true={hasRows}>
                <div class="legend">
                    <template for:each={legend} for:item="l">
                        <span key={l.key} class="legend-item"><span class={l.className}></span>{l.label}</span>
                    </template>
                </div>
                <div class="grid" style={gridStyle}>
                    <div class="label-col head">Asset / location<div class="resizer" title="Drag to resize" onmousedown={handleResizeStart}></div></div>
                    <div class="track head">
                        <div class="tier tier-top">
                            <template for:each={topTicks} for:item="t">
                                <div key={t.key} class={t.className} style={t.style}>{t.label}</div>
                            </template>
                        </div>
                        <div class="tier tier-bottom">
                            <template for:each={bottomTicks} for:item="t">
                                <div key={t.key} class={t.className} style={t.style}>{t.label}</div>
                            </template>
                        </div>
                    </div>
                    <template for:each={displayRows} for:item="row">
                        <div key={row.key} class="row">
                            <template if:true={row.isGroup}>
                                <div class={row.className} data-key={row.key} onclick={handleToggle}>
                                    <lightning-icon icon-name={row.icon} size="xx-small"></lightning-icon>
                                    <span class="group-label">{row.label}</span>
                                    <span class="kpis">
                                        <template for:each={row.chips} for:item="k">
                                            <span key={k.key} class={k.className} title={k.title}>{k.label}</span>
                                        </template>
                                    </span>
                                </div>
                            </template>
                            <template if:false={row.isGroup}>
                                <div class={row.labelClass} data-id={row.assetId} onmouseenter={handleAssetEnter} onmouseleave={handleAssetLeave}>
                                    <span class={row.critClass}>{row.critAbbr}</span>
                                    <a href={row.href} class="asset-name" data-id={row.assetId} data-object={row.objectApiName} onclick={handleRecordClick}>{row.assetName}</a>
                                    <template if:true={row.accountName}><span class="acct" title="Account">{row.accountName}</span></template>
                                </div>
                                <div class="track">
                                    <template for:each={bottomTicks} for:item="t">
                                        <div key={t.key} class="gridline" style={t.style}></div>
                                    </template>
                                    <div class="today" style={todayStyle}></div>
                                    <template for:each={row.bars} for:item="b">
                                        <div key={b.key} class={b.className} style={b.style} data-id={b.id} onclick={handleBarClick} onmouseenter={handleBarEnter} onmouseleave={handleAssetLeave}></div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>
            <template if:false={hasRows}>
                <template if:false={isLoading}>
                    <div class="slds-text-color_weak slds-p-vertical_small">No assets or work orders for this selection.</div>
                </template>
            </template>

            <template if:true={hover}>
                <div class={hover.cardClass} style={hover.style}>
                    <div class={hover.headClass}>
                        <lightning-icon icon-name={hover.headIcon} size="small"></lightning-icon>
                        <span class="hover-name">{hover.title}</span>
                        <span class={hover.badgeClass}>{hover.badgeText}</span>
                    </div>
                    <dl class="hover-body">
                        <template for:each={hover.fields} for:item="f">
                            <div key={f.key} class="hover-field">
                                <lightning-icon icon-name={f.icon} size="xx-small" class="hover-ico"></lightning-icon>
                                <dt>{f.label}</dt>
                                <dd><span class={f.valueClass}>{f.value}</span></dd>
                            </div>
                        </template>
                    </dl>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
