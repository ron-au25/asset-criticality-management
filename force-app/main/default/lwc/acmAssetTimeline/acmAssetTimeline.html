<template>
    <lightning-card title="Asset Work Order Timeline" icon-name="standard:timeline">
        <div slot="actions" class="summary">{summary}</div>
        <div class="slds-p-horizontal_medium wrap">
            <div class="bar-top">
                <div class="nav">
                    <div class="nav-btns">
                        <lightning-button-icon icon-name="utility:chevronleft" variant="border" alternative-text="Previous" onclick={handlePrev}></lightning-button-icon>
                        <lightning-button label="Today" onclick={handleToday}></lightning-button>
                        <lightning-button-icon icon-name="utility:chevronright" variant="border" alternative-text="Next" onclick={handleNext}></lightning-button-icon>
                    </div>
                    <span class="range">{rangeLabel}</span>
                </div>
                <div class="quick">
                    <template if:true={showTreeControls}>
                        <lightning-input class="searchbox" type="search" variant="label-hidden" label="Find assets or locations" placeholder="Find assets or locations…" value={searchText} onchange={handleSearch}></lightning-input>
                    </template>
                    <lightning-combobox class="ctl" name="view" label="View" variant="label-hidden" value={view} options={viewOptions} onchange={handleView}></lightning-combobox>
                    <lightning-combobox class="ctl" name="colour" label="Colour by" variant="label-hidden" value={colourMode} options={colourOptions} onchange={handleColour}></lightning-combobox>
                    <lightning-button-icon icon-name="utility:refresh" variant="border" alternative-text="Refresh" title="Refresh" onclick={handleRefresh}></lightning-button-icon>
                    <template if:true={showTreeControls}>
                        <div class="nav-btns">
                            <lightning-button-icon icon-name="utility:expand_all" variant="border" alternative-text="Expand all locations" title="Expand all locations" onclick={handleExpandAll}></lightning-button-icon>
                            <lightning-button-icon icon-name="utility:collapse_all" variant="border" alternative-text="Collapse all" title="Collapse all" onclick={handleCollapseAll}></lightning-button-icon>
                        </div>
                    </template>
                    <button class="filter-toggle" type="button" aria-expanded={filtersOpen} onclick={handleFilterToggle}>
                        <lightning-icon icon-name={filterIcon} size="xx-small"></lightning-icon>
                        <span>{filterLabel}</span>
                    </button>
                </div>
            </div>
            <div class={progressClass}></div>

            <template if:true={filtersOpen}>
                <div class="filters">
                    <lightning-input type="date" label="Start date" value={startDate} onchange={handleStart}></lightning-input>
                    <lightning-combobox label="Criticality" value={critFilter} options={critOptions} onchange={handleCrit}></lightning-combobox>
                    <template if:true={showCentre}>
                        <div class="slds-form-element" onclick={handleDdInside} onkeydown={handleTypesKey}>
                            <label class="slds-form-element__label" for="centre-btn">Location</label>
                            <div class="slds-form-element__control">
                                <div class={centreDropdownClass}>
                                    <button id="centre-btn" type="button" class="dd-btn" aria-haspopup="true" aria-expanded={centreExpanded} onclick={handleCentreMenu}>
                                        <span class="dd-btn-text">{centreSummary}</span>
                                        <lightning-icon icon-name="utility:down" size="xx-small"></lightning-icon>
                                    </button>
                                    <div class="slds-dropdown slds-dropdown_left slds-dropdown_fluid dd-panel">
                                        <template if:true={hasCentreSelection}>
                                            <button type="button" class="dd-clear" onclick={handleCentreClear}>Clear all</button>
                                        </template>
                                        <ul class="slds-dropdown__list" role="menu">
                                            <template for:each={centreItems} for:item="o">
                                                <li key={o.value} class="slds-dropdown__item dd-item" role="presentation">
                                                    <lightning-input type="checkbox" label={o.label} data-value={o.value} checked={o.checked} onchange={handleCentreToggle}></lightning-input>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                    <template if:true={showTypeFilter}>
                        <div class="slds-form-element" onclick={handleDdInside} onkeydown={handleTypesKey}>
                            <label class="slds-form-element__label" for="type-btn">Location types</label>
                            <div class="slds-form-element__control">
                                <div class={typeDropdownClass}>
                                    <button id="type-btn" type="button" class="dd-btn" aria-haspopup="true" aria-expanded={typesExpanded} onclick={handleTypesToggle}>
                                        <span class="dd-btn-text">{typeSummary}</span>
                                        <lightning-icon icon-name="utility:down" size="xx-small"></lightning-icon>
                                    </button>
                                    <div class="slds-dropdown slds-dropdown_left slds-dropdown_fluid dd-panel">
                                        <template if:true={hasTypeSelection}>
                                            <button type="button" class="dd-clear" onclick={handleTypesClear}>Clear all</button>
                                        </template>
                                        <ul class="slds-dropdown__list" role="menu">
                                            <template for:each={typeItems} for:item="o">
                                                <li key={o.value} class="slds-dropdown__item dd-item" role="presentation">
                                                    <lightning-input type="checkbox" label={o.label} data-value={o.value} checked={o.checked} onchange={handleTypeToggle}></lightning-input>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <template if:true={error}>
                <div class="slds-text-color_error">{error}</div>
            </template>
            <template if:true={notice}>
                <div class="notice">{notice}</div>
            </template>
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <template if:true={hasRows}>
                <div class="legend">
                    <template for:each={legend} for:item="l">
                        <span key={l.key} class="legend-item"><span class={l.className}></span>{l.label}</span>
                    </template>
                </div>
                <div class="grid" style={gridStyle}>
                    <div class="label-col head">Location / asset<div class="resizer" title="Drag to resize" onmousedown={handleResizeStart}></div></div>
                    <div class="track head">
                        <div class="tier tier-top">
                            <template for:each={topTicks} for:item="t">
                                <div key={t.key} class={t.className} style={t.style}>{t.label}</div>
                            </template>
                        </div>
                        <div class="tier tier-bottom">
                            <template for:each={bottomTicks} for:item="t">
                                <div key={t.key} class={t.className} style={t.style}>{t.label}</div>
                            </template>
                        </div>
                    </div>
                    <template for:each={displayRows} for:item="row">
                        <div key={row.key} class="row">
                            <div class={row.labelClass} style={row.labelStyle} title={row.title} data-key={row.key} onmouseenter={handleLabelEnter} onmouseleave={handleLeave} onclick={handleLabelClick}>
                                <template if:true={row.isNode}>
                                    <template if:true={row.hasKids}>
                                        <button type="button" class="chev" data-key={row.key} aria-label="Expand or collapse" onclick={handleChevron}>
                                            <lightning-icon icon-name={row.icon} size="xx-small"></lightning-icon>
                                        </button>
                                    </template>
                                    <template if:false={row.hasKids}><span class="chev-pad"></span></template>
                                    <template if:true={row.isLoc}>
                                        <span class="group-label">{row.name}</span>
                                        <span class="kpis">
                                            <template for:each={row.chips} for:item="k">
                                                <span key={k.key} class={k.className} title={k.title}>{k.label}</span>
                                            </template>
                                        </span>
                                    </template>
                                    <template if:true={row.isAsset}>
                                        <span class={row.critClass}>{row.critAbbr}</span>
                                        <a href={row.href} class="asset-name" data-id={row.assetId} onclick={handleRecordClick}>{row.name}</a>
                                    </template>
                                </template>
                                <template if:true={row.isMore}>
                                    <button type="button" class="linkbtn" data-loc={row.locKey} onclick={handleMore}>{row.label}</button>
                                </template>
                                <template if:true={row.isShowAll}>
                                    <button type="button" class="linkbtn" data-loc={row.locKey} onclick={handleShowAll}>{row.label}</button>
                                </template>
                                <template if:true={row.isNote}><span class="note-text">{row.label}</span></template>
                            </div>
                            <div class={row.trackClass}>
                                <div class="gridbg" style={gridBgStyle}></div>
                                <div class="today" style={todayStyle}></div>
                                <template for:each={row.bars} for:item="b">
                                    <div key={b.key} class={b.className} style={b.style} data-id={b.id} data-row={b.rowKey} onclick={handleBarClick} onmouseenter={handleBarEnter} onmouseleave={handleLeave}></div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <template if:false={hasRows}>
                <template if:false={isLoading}>
                    <div class="slds-text-color_weak slds-p-vertical_small">{emptyText}</div>
                </template>
            </template>

            <template if:true={hover}>
                <div class={hover.cardClass} style={hover.style}>
                    <div class={hover.headClass}>
                        <lightning-icon icon-name={hover.headIcon} size="small"></lightning-icon>
                        <span class="hover-name">{hover.title}</span>
                        <span class={hover.badgeClass}>{hover.badgeText}</span>
                    </div>
                    <dl class="hover-body">
                        <template for:each={hover.fields} for:item="f">
                            <div key={f.key} class="hover-field">
                                <lightning-icon icon-name={f.icon} size="xx-small" class="hover-ico"></lightning-icon>
                                <dt>{f.label}</dt>
                                <dd><span class={f.valueClass}>{f.value}</span></dd>
                            </div>
                        </template>
                    </dl>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
